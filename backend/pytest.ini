[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast unit tests with no external dependencies
    integration: integration tests that may need backend running
    slow: tests that take more than 5 seconds
    ui: Playwright or Selenium UI tests
asyncio_mode = auto
log_cli = true
log_cli_level = WARNING
addopts = -ra --tb=short
