name: Aurora CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov flake8 bandit

      - name: Lint — flake8
        working-directory: backend
        run: |
          flake8 app/ --max-line-length=120 --format=pylint \
            --output-file=flake8-report.txt || true
          cat flake8-report.txt

      - name: Security — bandit
        working-directory: backend
        run: bandit -r app/ --severity-level medium -f json -o bandit-report.json || true

      - name: Unit tests
        working-directory: backend
        run: |
          mkdir -p test-results
          pytest tests/unit/ -v --tb=short \
            --junitxml=test-results/unit.xml \
            --cov=app --cov-report=xml:coverage.xml \
            -m "not integration and not slow" || true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/test-results/
            backend/coverage.xml
            backend/flake8-report.txt
            backend/bandit-report.json

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ lint-and-test, build-frontend ]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t aurora-backend:${{ github.sha }} ./backend
          echo "Docker build: OK"

      - name: Smoke test container startup
        run: |
          docker run -d --name aurora-smoke \
            -e OLLAMA_BASE_URL=http://localhost:11434 \
            -e OLLAMA_MODEL=llama3.2:3b \
            -p 8000:8000 \
            aurora-backend:${{ github.sha }}
          sleep 15
          docker logs aurora-smoke | tail -20
