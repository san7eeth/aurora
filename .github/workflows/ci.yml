name: Aurora CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint, security, unit, integration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:////tmp/aurora-ci-tests.db
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install application and QA dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint backend
        working-directory: backend
        run: flake8 app --max-line-length=120 --count --statistics
      - name: Scan Python code
        working-directory: backend
        run: bandit -r app --severity-level medium
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Unit tests
        working-directory: backend
        run: |
          mkdir -p test-results
          pytest tests/unit -v --tb=short --junitxml=test-results/unit.xml --cov=app --cov-report=xml:coverage.xml
      - name: Integration tests
        working-directory: backend
        run: |
          mkdir -p test-results
          pytest tests/integration -v --tb=short --junitxml=test-results/integration.xml -m integration
      - name: Publish Python test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/test-results/*.xml
            backend/coverage.xml
          if-no-files-found: ignore

  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  container-ui-and-java-qa:
    name: Docker, Playwright UI, and Java QA
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    env:
      AURORA_BACKEND_IMAGE: aurora-backend:ci
      AURORA_FRONTEND_IMAGE: aurora-frontend:ci
      BACKEND_URL: http://localhost:8000
      AURORA_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: qa-java/pom.xml
      - name: Build backend and frontend images
        run: |
          docker build -t "$AURORA_BACKEND_IMAGE" ./backend
          docker build --build-arg VITE_WS_BASE=ws://localhost:8000 -t "$AURORA_FRONTEND_IMAGE" ./frontend
      - name: Start isolated smoke environment
        run: |
          mkdir -p test-results/e2e
          docker compose -p aurora-ci up -d --no-build aurora-backend aurora-frontend
          for attempt in $(seq 1 60); do
            if curl -fsS "$BACKEND_URL/health" >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS "$BACKEND_URL/health" >/dev/null
      - name: Run Playwright UI and API smoke checks
        run: docker compose -p aurora-ci --profile qa run --build --rm aurora-e2e
      - name: Run Java REST Assured and Cucumber checks
        working-directory: qa-java
        run: mvn -B -Dtest=AuroraAPITest,AuroraBDDTest test
      - name: Publish browser and Java reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-java-reports
          path: |
            test-results/e2e/
            qa-java/target/surefire-reports/
            qa-java/target/cucumber-report.html
            qa-java/target/cucumber-results.xml
          if-no-files-found: ignore
      - name: Stop smoke environment
        if: always()
        run: docker compose -p aurora-ci down --volumes --remove-orphans
