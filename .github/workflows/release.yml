name: Aurora Release Artifacts

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-linux-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Build release images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t "aurora-backend:${VERSION}" ./backend
          docker build --build-arg VITE_WS_BASE=ws://localhost:8000 -t "aurora-frontend:${VERSION}" ./frontend
      - name: Assemble checksummed release assets
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME#v}"
          cp -R frontend/dist release/frontend-dist
          docker save "aurora-backend:${VERSION}" "aurora-frontend:${VERSION}" -o "release/aurora-docker-images-${VERSION}.tar"
          printf 'version=%s\ncommit=%s\ncreated_utc=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > release/manifest.txt
          cd release && zip -qr "aurora-frontend-${VERSION}.zip" frontend-dist manifest.txt
          sha256sum aurora-docker-images-*.tar "aurora-frontend-${VERSION}.zip" manifest.txt > SHA256SUMS
      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: release/*
          if-no-files-found: error

  windows-portable:
    needs: build-linux-assets
    runs-on: windows-latest
    environment: aurora-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build portable application
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $declaredVersion = (Get-Content packaging/portable/VERSION -Raw).Trim()
          if ($version -ne $declaredVersion) { throw "Release tag version $version does not match packaging/portable/VERSION ($declaredVersion)." }
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.txt -r packaging/portable/requirements-packaging.txt
          if ($LASTEXITCODE) { throw 'Python dependency installation failed' }
          Push-Location frontend
          npm ci
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          npm run lint
          if ($LASTEXITCODE) { throw 'Frontend lint failed' }
          npm run build
          if ($LASTEXITCODE) { throw 'Frontend build failed' }
          Pop-Location
          ./packaging/portable/build_release.ps1 -SkipFrontendBuild
      - name: Sign and package portable ZIP
        shell: pwsh
        env:
          SIGNING_PRIVATE_PEM: ${{ secrets.AURORA_RELEASE_PRIVATE_KEY }}
          SIGNING_PUBLIC_PEM: ${{ secrets.AURORA_RELEASE_PUBLIC_KEY }}
          SIGNING_FINGERPRINT: ${{ vars.AURORA_RELEASE_KEY_FINGERPRINT }}
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'aurora-release-private.pem'
          $public = Join-Path $env:RUNNER_TEMP 'aurora-release-public.pem'
          try {
            if (-not $env:SIGNING_PRIVATE_PEM -or -not $env:SIGNING_PUBLIC_PEM -or -not $env:SIGNING_FINGERPRINT) { throw 'Protected release signing secrets/fingerprint are not configured.' }
            [IO.File]::WriteAllText($private, $env:SIGNING_PRIVATE_PEM)
            [IO.File]::WriteAllText($public, $env:SIGNING_PUBLIC_PEM)
            $env:AURORA_RELEASE_PRIVATE_KEY = $private
            $env:AURORA_RELEASE_PUBLIC_KEY = $public
            $env:AURORA_RELEASE_KEY_FINGERPRINT = $env:SIGNING_FINGERPRINT
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            $declaredVersion = (Get-Content packaging/portable/VERSION -Raw).Trim()
            if ($version -ne $declaredVersion) { throw "Release tag version $version does not match packaging/portable/VERSION ($declaredVersion)." }
            ./packaging/portable/package_portable.ps1 -Version $version
          } finally {
            Remove-Item $private,$public -Force -ErrorAction SilentlyContinue
          }
      - name: Upload signed portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-assets
          path: |
            release/Aurora-v*-Windows-x64-Portable.zip
            release/Aurora-v*-Windows-x64-Portable.zip.sha256
          if-no-files-found: error

  publish-release:
    needs: [build-linux-assets, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable-assets
          path: release
      - name: Publish complete release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/aurora-docker-images-*.tar
            release/aurora-frontend-*.zip
            release/SHA256SUMS
            release/manifest.txt
            release/Aurora-v*-Windows-x64-Portable.zip
            release/Aurora-v*-Windows-x64-Portable.zip.sha256
