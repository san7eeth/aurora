# SonarQube project configuration for Aurora
sonar.projectKey=aurora
sonar.projectName=Aurora AI Assistant
sonar.projectVersion=0.3.0

# Source and test paths
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,e2e-playwright/tests,qa-java/src/test/java

# Exclusions
sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/node_modules/**,\
  **/dist/**,\
  backend/.venv/**,\
  frontend/node_modules/**,\
  frontend/dist/**,\
  qa-java/target/**

# Python settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=test-results/coverage.xml
sonar.python.flake8.reportPaths=flake8-report.txt
sonar.java.binaries=qa-java/target/test-classes

# Quality gate
sonar.qualitygate.wait=true
