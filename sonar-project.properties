# SonarQube project configuration for Aurora
sonar.projectKey=aurora
sonar.projectName=Aurora AI Assistant
sonar.projectVersion=0.2.0

# Source and test paths
sonar.sources=backend/app
sonar.tests=backend/tests

# Exclusions
sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  backend/.venv/**,\
  frontend/node_modules/**,\
  frontend/dist/**,\
  qa-java/target/**

# Python settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.flake8.reportPaths=backend/flake8-report.txt

# Quality gate
sonar.qualitygate.wait=true
