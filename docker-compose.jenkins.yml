# Local learning stack only. Access to docker.sock grants host-level Docker control.
# Start only on a machine where the workspace and Jenkins are trusted.
services:
  jenkins:
    build:
      context: .
      dockerfile: devops/jenkins/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  jenkins-home:
